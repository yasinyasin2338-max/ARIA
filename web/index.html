0 8px}.welcome p{color:#999;font-size:13px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:34px}.card{background:#292929;border:1px solid #3a3a3a;border-radius:14px;padding:15px;text-align:right}.card small{display:block;color:#999;font-size:10px;margin-top:5px}.messages{max-width:900px;width:100%;margin:auto;padding:24px 18px 170px}.msg{display:flex;gap:12px;margin:22px 0;line-height:1.9;font-size:14px}.avatar{width:31px;height:31px;border-radius:50%;flex:none}.bubble{flex:1;min-width:0;overflow-wrap:anywhere;white-space:pre-wrap}.user .bubble{background:#303030;border-radius:16px;padding:12px 15px}.bubble code{display:block;direction:ltr;text-align:left;background:#111;border:1px solid #444;border-radius:10px;padding:12px;overflow:auto}.actions{display:flex;gap:5px;margin-top:6px}.actions button{border:0;background:transparent;color:#888;font-size:10px}.media{max-width:100%;max-height:55vh;border-radius:14px;margin-top:10px}.sources{font-size:10px;color:#777;margin-top:7px}.composerWrap{position:absolute;left:0;right:0;bottom:0;padding:14px max(10px,calc((100% - 900px)/2));background:linear-gradient(transparent,#212121 24%)}.composer{background:#303030;border:1px solid #555;border-radius:18px;padding:8px;box-shadow:0 5px 30px #0006}.inputRow{display:flex;align-items:flex-end;gap:6px}.input{flex:1;background:transparent;border:0;outline:0;resize:none;min-height:30px;max-height:140px;padding:7px;line-height:1.7}.circle{width:39px;height:39px;border:0;border-radius:10px;background:#454545}.send{background:#eee;color:#111}.mic.active{background:var(--p);color:#fff}.toolbar{display:flex;gap:4px;overflow:auto;padding-top:7px}.tool{border:0;background:transparent;color:#aaa;white-space:nowrap;border-radius:7px;padding:6px 8px;font-size:10px}.tool.active,.tool:hover{background:#3b3b3b;color:#fff}.notice{text-align:center;color:#777;font-size:9px;padding:6px}.drawer{display:none}.hidden{display:none}@media(max-width:720px){.side{display:none}.menu{display:block}.cards{grid-template-columns:1fr}.welcome{padding-top:10vh}.welcome h1{font-size:24px}.messages{padding:18px 10px 170px}.top{height:54px}.composerWrap{padding:10px 8px}.drawer{position:fixed;inset:0;background:#0009;z-index:10}.drawer.open{display:block}.drawerPanel{width:285px;height:100%;background:#171717;padding:10px}.drawer .row{padding:12px}}</style></head><body><div class="app"><aside class="side"><div class="brand"><img src="/icon.svg"><div><b>ARIA</b><small>دستیار هوش مصنوعی</small></div></div><button class="new" id="new">＋ گفت‌وگوی جدید</button><input class="search" id="search" placeholder="جستجو در گفتگوها…"><div class="history" id="history"></div><div class="bottom"><button id="mem">🧠 حافظه</button><button id="settings">⚙ تنظیمات</button></div></aside><main class="main"><header class="top"><button class="menu" id="menu">☰</button><div class="model">ARIA <small>رایگان</small></div><div><button class="tool" id="topWeb">🌐 وب</button><button class="tool" id="topClear">پاک‌کردن</button></div></header><div class="scroll" id="scroll"><section class="welcome" id="welcome"><img class="logo" src="/icon.svg"><h1>سلام، من آریا هستم</h1><p>یک دستیار هوشمند فارسی برای گفتگو، جستجو، نوشتن، تصویر و صدا</p><div class="cards"><button class="card" data-q="برای امروز من یک برنامه کامل و هوشمند بساز.">💡 برنامه‌ریزی<small>ایده، تصمیم و برنامه روزانه</small></button><button class="card" data-q="یک متن حرفه‌ای و دقیق برای من بنویس.">✍️ نوشتن<small>متن، مقاله، نامه و کد</small></button><button class="card" data-q="آخرین اطلاعات مهم امروز را پیدا کن و خلاصه کن.">🌐 وب<small>اطلاعات تازه و جستجو</small></button><button class="card" data-q="یک ایده خلاقانه برای ساخت تصویر پیشنهاد بده.">🎨 تصویر<small>ساخت و ویرایش تصویر</small></button></div></section><section class="messages" id="messages"></section></div><div class="composerWrap"><form class="composer" id="form"><div class="inputRow"><textarea id="input" class="input" rows="1" placeholder="پیامی برای آریا بنویس…"></textarea><button type="button" id="mic" class="circle">🎙</button><button class="circle send">↑</button></div><div class="toolbar"><button type="button" class="tool" id="attach">＋ پیوست</button><button type="button" class="tool" id="web">🌐 جستجوی وب</button><button type="button" class="tool" id="image">✦ ساخت تصویر</button><button type="button" class="tool" id="edit">✎ ویرایش</button><button type="button" class="tool" id="video">▶ تصویر→ویدیو</button><button type="button" class="tool active" id="voice">🔊 صدا</button></div></form><div class="notice">ARIA رایگان است؛ ظرفیت مدل‌های رایگان ممکن است محدود یا صف‌دار باشد.</div></div></main></div><div class="drawer" id="drawer"><div class="drawerPanel"><button class="new" id="drawerNew">＋ گفت‌وگوی جدید</button><div id="drawerHistory"></div></div></div><input id="file" class="hidden" type="file" accept="image/*,*/*"><script>const $=id=>document.getElementById(id);let memory=localStorage.getItem('aria_memory')||'',chats=JSON.parse(localStorage.getItem('aria_chats')||'[]'),current=[],web=false,voiceOn=localStorage.getItem('aria_voice')!=='0',mode='chat',recognition=null,listening=false;const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));function fmt(s){return esc(s).replace(/```([\s\S]*?)```/g,'<code>$1</code>').replace(/\*\*(.*?)\*\*/g,'<b>$1</b>')}function save(){localStorage.setItem('aria_memory',memory);localStorage.setItem('aria_chats',JSON.stringify(chats))}function add(text,role='ai',image){$('welcome').style.display='none';let m=document.createElement('div');m.className='msg '+role;let a=document.createElement('img');a.className='avatar';a.src='/icon.svg';let b=document.createElement('div');b.className='bubble';b.innerHTML=fmt(text);if(image){let im=document.createElement('img');im.className='media';im.src=image;b.append(im)}if(role==='ai'){let ac=document.createElement('div');ac.className='actions';let cp=document.createElement('button');cp.textContent='کپی';cp.onclick=()=>navigator.clipboard?.writeText(text);ac.append(cp);b.append(ac)}m.append(a,b);$('messages').append(m);$('scroll').scrollTop=$('scroll').scrollHeight;return b}function speak(t){if(!voiceOn||!t)return;if(window.ARIA?.speak){window.ARIA.speak(t);return}if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='fa-IR';u.rate=1;u.pitch=1.05;speechSynthesis.speak(u)}}async function chat(text){if(!text.trim())return;current.push({role:'user',text});add(text,'user');let b=add('در حال فکر کردن…');$('send')?.setAttribute('disabled','');try{let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,memory,web})}),d=await r.json();if(!r.ok)throw Error(d.error||'خطا');b.innerHTML=fmt(d.text||'پاسخی دریافت نشد.');if(d.sources?.length){let s=document.createElement('div');s.className='sources';s.textContent='منابع: '+d.sources.slice(0,5).map(x=>x.title||x.url).join(' • ');b.append(s)}current.push({role:'assistant',text:d.text||''});memory=(memory+'\nکاربر: '+text+'\nARIA: '+(d.text||'')).slice(-30000);chats.unshift({title:text.slice(0,50),messages:[...current],time:Date.now()});chats=chats.slice(0,50);save();speak(d.text||'')}catch(e){b.textContent='خطا: '+e.message}}$('form').onsubmit=e=>{e.preventDefault();let t=$('input').value.trim();if(!t)return;$('input').value='';if(mode==='image'){mode='chat';image(t);return}if(mode==='video'){mode='chat';video(t);return}if(mode==='edit'){mode='chat';$('input').dataset.prompt=t;$('file').click();return}chat(t)};$('input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('form').requestSubmit()}};function recog(){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return null;let r=new R();r.lang='fa-IR';r.interimResults=true;r.onstart=()=>{$('mic').classList.add('active');listening=true};r.onend=()=>{$('mic').classList.remove('active');listening=false};r.onresult=e=>{let t='';for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)t+=e.results[i][0].transcript;else $('input').value=e.results[i][0].transcript;if(t){$('input').value=t;$('form').requestSubmit()}};return r}$('mic').onclick=()=>{recognition=recognition||recog();if(!recognition){add('تشخیص گفتار مرورگر در دسترس نیست؛ از میکروفون نسخه اندروید استفاده کن.');return}if(listening)recognition.stop();else try{recognition.start()}catch{}};$('web').onclick=()=>{web=!web;$('web').classList.toggle('active',web);$('topWeb').classList.toggle('active',web)};$('topWeb').onclick=()=>$('web').click();$('voice').onclick=()=>{voiceOn=!voiceOn;localStorage.setItem('aria_voice',voiceOn?'1':'0');$('voice').classList.toggle('active',voiceOn)};$('image').onclick=()=>{mode='image';$('input').placeholder='توضیح دقیق تصویر…';$('input').focus()};$('video').onclick=()=>{mode='video';$('input').placeholder='توضیح ویدیو…';$('input').focus()};$('edit').onclick=()=>{mode='edit';$('input').placeholder='دستور ویرایش تصویر…';$('input').focus()};$('attach').onclick=()=>$('file').click();$('file').onchange=()=>{let f=$('file').files[0];if(f){let r=new FileReader();r.onload=()=>{window.pendingImage=r.result;add('تصویر انتخاب شد. حالا دستور ویرایش را بنویس.','ai',r.result)};r.readAsDataURL(f)}};async function image(p){let b=add('در حال ساخت تصویر…');try{let r=await fetch('/api/image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:p})}),d=await r.json();if(!r.ok)throw Error(d.error||'ساخت تصویر ناموفق');b.textContent='تصویر آماده شد.';if(d.image){let im=document.createElement('img');im.className='media';im.src=d.image;b.append(im)}}catch(e){b.textContent='خطا: '+e.message}}async function video(p){let b=add('در حال ارسال درخواست ویدیو…');try{let r=await fetch('/api/media',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:p})}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'سرویس ویدیو متصل نیست');b.textContent=d.message||'درخواست ارسال شد.'}catch(e){b.textContent='ویدیو: '+e.message}}function clearAll(){current=[];memory='';$('messages').innerHTML='';$('welcome').style.display='block';localStorage.removeItem('aria_memory');save()}$('new').onclick=clearAll;$('topClear').onclick=clearAll;$('drawerNew').onclick=()=>{$('drawer').classList.remove('open');clearAll()};$('menu').onclick=()=>{$('drawer').classList.add('open');$('drawerHistory').innerHTML=$('history').innerHTML};$('mem').onclick=()=>add('حافظه محلی آریا فعال است و خلاصه گفتگوهای اخیر را نگه می‌دارد.');$('settings').onclick=()=>add('تنظیمات: صدا، وب و ابزارهای تصویر از نوار پایین قابل کنترل هستند.');function hist(){let h=$('history');h.innerHTML='';chats.forEach(c=>{let d=document.createElement('div');d.className='row';d.textContent=c.title||'گفتگو';d.onclick=()=>{current=c.messages||[];$('welcome').style.display='none';$('messages').innerHTML='';current.forEach(x=>add(x.text,x.role==='user'?'user':'ai'))};h.append(d)})}hist();$('search').oninput=e=>{let q=e.target.value.toLowerCase();document.querySelectorAll('.row').forEach(x=>x.style.display=x.textContent.toLowerCase().includes(q)?'block':'none')};document.querySelectorAll('[data-q]').forEach(x=>x.onclick=()=>chat(x.dataset.q));</script></body></html>
