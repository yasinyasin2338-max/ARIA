<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#050505"><meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"><title>ARIA</title>
<style>
:root{--bg:#030304;--panel:#0b0b0f;--red:#ff163d;--red2:#ff667d;--white:#fff;--muted:#9d9da6}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{overflow:hidden}.app{height:100dvh;max-width:900px;margin:auto;position:relative;display:flex;flex-direction:column;background:radial-gradient(600px 430px at 50% 31%,#3b0b18 0,#11070b 28%,#050506 67%,#020203 100%)}header{height:68px;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;z-index:5;background:#050506aa;backdrop-filter:blur(22px);border-bottom:1px solid #fff0}.brand{display:flex;gap:10px;align-items:center}.brand img{width:42px;height:42px;border-radius:50%;box-shadow:0 0 28px #ff174455}.brand b{font-size:20px}.brand small{display:block;color:#aaa;font-size:9px}.status{font-size:10px;color:#aaa;display:flex;gap:7px;align-items:center}.status i{width:7px;height:7px;border-radius:50%;background:#61f7b0;box-shadow:0 0 12px currentColor}.main{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}.hero{text-align:center;padding-top:15px;z-index:2}.hero h1{margin:0;font-size:22px}.hero p{margin:5px 0 0;color:#a6a6ad;font-size:11px}.orbWrap{height:42%;min-height:260px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}.ring{position:absolute;border:1px solid #ff315533;border-radius:50%;animation:radar 3s ease-out infinite}.r1{width:180px;height:180px}.r2{width:270px;height:270px;animation-delay:.7s}.r3{width:360px;height:360px;animation-delay:1.4s}.waves{position:absolute;width:380px;height:180px}.waves span{position:absolute;left:0;right:0;top:50%;height:70px;border:1px solid #ffffff24;border-radius:50%;transform:translateY(-50%) scaleX(1.6);animation:wave 2.2s ease-in-out infinite}.waves span:nth-child(2){animation-delay:.3s}.waves span:nth-child(3){animation-delay:.6s}.waves span:nth-child(4){animation-delay:.9s}.orb{width:132px;height:132px;border-radius:50%;z-index:2;position:relative;background:radial-gradient(circle at 35% 28%,#fff 0 3%,#ffe7eb 9%,#ff7589 25%,#ff173f 49%,#970a28 72%,#28030d 100%);box-shadow:0 0 30px #ff174488,0 0 90px #ff174444,inset 0 0 30px #fff8;display:flex;align-items:center;justify-content:center;animation:float 3s ease-in-out infinite}.orb:before{content:"";position:absolute;inset:19px;border:2px solid #fff9;border-radius:50%;box-shadow:0 0 18px #fff7}.orb:after{content:"ARIA";font-weight:900;letter-spacing:2px;font-size:16px;text-shadow:0 2px 10px #0009}.orb.listen{animation:listen .55s ease-in-out infinite alternate}.orb.think{animation:spin 1.4s linear infinite}.orb.speak{animation:speak .7s ease-in-out infinite alternate}.hint{text-align:center;color:#aaa;font-size:11px;position:absolute;bottom:12px;left:0;right:0}.messages{flex:1;min-height:0;overflow:auto;padding:5px 14px 205px}.bubble{max-width:91%;padding:12px 15px;border-radius:20px;margin:8px 0;line-height:1.9;font-size:13px;white-space:pre-wrap;word-break:break-word;box-shadow:0 10px 30px #0008}.bubble.ai{margin-left:auto;background:#101014;border:1px solid #ffffff12}.bubble.user{margin-right:auto;background:linear-gradient(145deg,#3b0b16,#17070c);border:1px solid #ff31552b}.bubble.err{color:#ffb5c1;border-color:#ff315555}.media{display:block;width:100%;max-height:48vh;object-fit:contain;border-radius:15px;margin-top:8px}.source{display:block;color:#777;font-size:9px;margin-top:7px}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px max(10px,calc((100vw - 900px)/2 + 10px)) calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#030304 18%,#030304 72%)}.quick{display:flex;gap:7px;overflow:auto;padding:3px 0 8px;scrollbar-width:none}.q{white-space:nowrap;border:1px solid #ffffff13;background:#0d0d11;color:#ddd;border-radius:999px;padding:8px 12px;font-size:10px}.composer{display:flex;align-items:flex-end;gap:7px;padding:7px;border:1px solid #ffffff18;background:#0b0b0edb;border-radius:28px;backdrop-filter:blur(22px);box-shadow:0 15px 45px #000d}.composer textarea{flex:1;background:transparent;border:0;outline:0;color:#fff;resize:none;font:inherit;font-size:14px;line-height:1.7;min-height:43px;max-height:100px;padding:8px}.circle{width:45px;height:45px;border:0;border-radius:50%;font-size:18px}.mic{background:#fff;color:#050505}.mic.active{background:var(--red);color:#fff;box-shadow:0 0 25px #ff174477}.send{background:linear-gradient(145deg,#ff3b5b,#c9082d);color:#fff}.tools{display:flex;gap:6px;overflow:auto;margin-top:7px;scrollbar-width:none}.tool{white-space:nowrap;border:1px solid #ffffff12;background:#0d0d10;color:#ccc;border-radius:999px;padding:7px 10px;font-size:10px}.tool.active{border-color:#ff315555;background:#270912;color:#fff}.hidden{display:none}@keyframes radar{0%{transform:scale(.72);opacity:.75}100%{transform:scale(1.18);opacity:0}}@keyframes wave{0%,100%{transform:translateY(-50%) scaleX(1.2);opacity:.06}50%{transform:translateY(-50%) scaleX(1.8) scaleY(1.35);opacity:.7}}@keyframes float{50%{transform:translateY(-7px) scale(1.03)}}@keyframes listen{to{transform:scale(1.14);box-shadow:0 0 45px #ff1744bb,0 0 120px #ff174455,inset 0 0 35px #fff}}@keyframes speak{to{transform:scale(1.1)}}@keyframes spin{to{transform:rotate(360deg)}}
</style></head>
<body><main class="app"><header><div class="brand"><img src="/icon.svg"><div><b>ARIA</b><small>دستیار هوشمند فارسی</small></div></div><div class="status"><i id="dot"></i><span id="status">در حال اتصال…</span></div></header>
<section class="main"><div class="hero"><h1>سلام یاسین</h1><p id="sub">برای صحبت، روی میکروفون بزن یا بگو «سلام آریا»</p></div>
<div class="orbWrap"><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="waves"><span></span><span></span><span></span><span></span></div><div id="orb" class="orb"></div><div class="hint" id="hint">آماده‌ام</div></div><section id="messages" class="messages"></section></section>
<div class="bottom"><div class="quick"><button class="q" data-q="سلام آریا، خودت را معرفی کن و بگو چه کارهایی می‌توانی انجام بدهی؟">قابلیت‌ها</button><button class="q" data-q="برای امروز من یک برنامه هوشمند بساز.">برنامه‌ریزی</button><button class="q" data-q="یک ایده خلاقانه برای تصویر بده.">تصویر</button><button class="q" data-q="یک متن حرفه‌ای برای من بنویس.">نوشتن</button></div><form id="form" class="composer"><textarea id="input" rows="1" placeholder="با آریا صحبت کن…"></textarea><button id="mic" class="circle mic" type="button">🎙</button><button id="send" class="circle send" type="submit">↑</button></form><div class="tools"><button class="tool" id="web">🌐 وب</button><button class="tool" id="image">✦ تصویر</button><button class="tool" id="edit">✎ ویرایش</button><button class="tool" id="video">▶ تصویر→ویدیو</button><button class="tool active" id="voice">🔊 صدای آریا</button><button class="tool" id="clear">پاک‌کردن حافظه</button></div></div></main><input id="file" class="hidden" type="file" accept="image/*">
<script>
const $=id=>document.getElementById(id);const input=$('input'),form=$('form'),mic=$('mic'),send=$('send'),messages=$('messages'),orb=$('orb'),hint=$('hint'),status=$('status'),dot=$('dot');let memory=localStorage.getItem('aria_memory')||'',web=false,voiceOn=localStorage.getItem('aria_voice')!=='0',mode='chat',recognition=null,listening=false;
function add(text,kind='ai'){const b=document.createElement('div');b.className='bubble '+kind;b.textContent=text;messages.appendChild(b);messages.scrollTop=messages.scrollHeight;return b}
function state(s){orb.classList.remove('listen','think','speak');if(s)orb.classList.add(s);hint.textContent=s==='listen'?'گوش می‌دهم…':s==='think'?'در حال فکر کردن…':s==='speak'?'در حال صحبت…':'آماده‌ام'}
function speak(text){if(!voiceOn||!text)return;if(window.ARIA&&window.ARIA.speak){window.ARIA.speak(text);state('speak');setTimeout(()=>state(''),Math.min(6000,Math.max(900,text.length*42)));return}if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='fa-IR';u.rate=1;u.pitch=1.08;speechSynthesis.speak(u)}}
async function chat(text){if(!text)return;add(text,'user');const b=add('در حال فکر کردن…','ai');state('think');send.disabled=true;try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,memory,web})});const d=await r.json();if(!r.ok)throw Error(d.error||'خطا');b.textContent=d.text||'پاسخی دریافت نشد.';if(d.sources?.length){const s=document.createElement('small');s.className='source';s.textContent='منابع: '+d.sources.slice(0,4).map(x=>x.title||x.url||'منبع').join(' • ');b.appendChild(s)}memory=(memory+'\nکاربر: '+text+'\nARIA: '+(d.text||'')).slice(-30000);localStorage.setItem('aria_memory',memory);speak(d.text||'')}catch(e){b.className='bubble ai err';b.textContent='خطا: '+e.message}finally{send.disabled=false;state('');input.focus()}}
form.onsubmit=e=>{e.preventDefault();const t=input.value.trim();if(!t||send.disabled)return;input.value='';if(mode==='image'){mode='chat';image(t);return}if(mode==='video'){mode='chat';video(t);return}if(mode==='edit'){mode='chat';input.dataset.editPrompt=t;$('file').click();return}chat(t)};
function setupRecognition(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return null;const r=new R();r.lang='fa-IR';r.interimResults=true;r.continuous=false;r.maxAlternatives=2;r.onstart=()=>{listening=true;mic.classList.add('active');state('listen')};r.onend=()=>{listening=false;mic.classList.remove('active');if(orb.classList.contains('listen'))state('')};r.onerror=()=>{listening=false;mic.classList.remove('active');state('')};r.onresult=e=>{let final='';for(let i=e.resultIndex;i<e.results.length;i++){if(e.results[i].isFinal)final+=e.results[i][0].transcript;else input.value=e.results[i][0].transcript}if(final){input.value=final;chat(final);input.value=''}};return r}
mic.onclick=()=>{if(listening){try{recognition?.stop()}catch(e){}return}recognition=recognition||setupRecognition();if(!recognition){add('برای مکالمه صوتی از «سلام آریا» استفاده کن تا سرویس صوتی خود برنامه فعال شود.','ai');return}try{recognition.start()}catch(e){}};
window.ariaWake=text=>{hint.textContent='بله یاسین، گوش می‌دهم…';state('speak');input.focus();setTimeout(()=>state(''),1800)};
$('web').onclick=()=>{web=!web;$('web').classList.toggle('active',web)};$('voice').onclick=()=>{voiceOn=!voiceOn;localStorage.setItem('aria_voice',voiceOn?'1':'0');$('voice').classList.toggle('active',voiceOn)};$('clear').onclick=()=>{memory='';localStorage.removeItem('aria_memory');add('حافظهٔ محلی پاک شد.','ai')};$('image').onclick=()=>{mode='image';input.placeholder='توضیح تصویر را بگو…';input.focus()};$('video').onclick=()=>{mode='video';input.placeholder='توضیح ویدیو را بگو…';input.focus()};$('edit').onclick=()=>{mode='edit';input.placeholder='دستور ویرایش را بگو…';input.focus()};document.querySelectorAll('.q').forEach(b=>b.onclick=()=>chat(b.dataset.q));
async function image(prompt){const b=add('در حال ساخت تصویر…','ai');state('think');try{const r=await fetch('/api/image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,quality:'high'})});const d=await r.json();if(!r.ok)throw Error(d.error||'ساخت تصویر ناموفق');b.textContent='تصویر آماده شد.';if(d.image){const im=document.createElement('img');im.className='media';im.src=d.image;b.appendChild(im)}}catch(e){b.className='bubble ai err';b.textContent='خطا: '+e.message}finally{state('')}}
async function video(prompt){const b=add('درخواست تبدیل تصویر به ویدیو ارسال شد…','ai');state('think');try{const r=await fetch('/api/media',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt})});const d=await r.json();if(!r.ok)throw Error(d.error||'ویدیو هنوز به سرویس تولید متصل نیست');b.textContent=d.message||'درخواست ثبت شد.';if(d.url){const v=document.createElement('video');v.className='media';v.controls=true;v.src=d.url;b.appendChild(v)}}catch(e){b.className='bubble ai err';b.textContent='خطا: '+e.message}finally{state('')}}
$('file').onchange=()=>{const f=$('file').files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>editImage(input.dataset.editPrompt||'تصویر را حرفه‌ای ویرایش کن.',rd.result);rd.readAsDataURL(f);$('file').value=''};
async function editImage(prompt,img){const b=add('در حال ویرایش تصویر…','ai');state('think');try{const r=await fetch('/api/image-edit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,image:img})});const d=await r.json();if(!r.ok)throw Error(d.error||'ویرایش ناموفق');b.textContent='ویرایش انجام شد.';if(d.image){const im=document.createElement('img');im.className='media';im.src=d.image;b.appendChild(im)}}catch(e){b.className='bubble ai err';b.textContent='خطا: '+e.message}finally{state('')}}
async function health(){try{const r=await fetch('/api/health');const d=await r.json();status.textContent=d.configured?'آنلاین • '+(d.model||'ARIA'):'آنلاین';dot.style.background='#61f7b0'}catch{status.textContent='آفلاین';dot.style.background='#ff3155'}}health();input.focus();
</script></body></html>
