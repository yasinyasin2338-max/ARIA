<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#080808"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"><title>ARIA</title>
<style>
:root{--bg:#050505;--panel:#0d0d0f;--line:#26262b;--text:#fff;--muted:#a4a4aa;--red:#ff2747;--red2:#ff6b7e;--white:#f8f8fa}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#050505;color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow:hidden}.app{height:100dvh;max-width:900px;margin:auto;display:flex;flex-direction:column;position:relative;background:radial-gradient(520px 420px at 50% 38%,#281116 0,#09090b 42%,#050505 75%)}
.top{height:66px;padding:10px 15px;display:flex;align-items:center;justify-content:space-between;z-index:20;background:#050505c9;backdrop-filter:blur(18px);border-bottom:1px solid #fff1}.brand{display:flex;align-items:center;gap:10px}.logo{width:43px;height:43px;border-radius:50%;box-shadow:0 0 28px #ff244855}.brand b{font-size:21px;letter-spacing:.5px}.brand small{display:block;color:var(--muted);font-size:9px}.status{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:7px}.dot{width:7px;height:7px;border-radius:50%;background:#62f2b0;box-shadow:0 0 12px currentColor}
.stage{flex:1;min-height:0;position:relative;display:flex;flex-direction:column}.orb-zone{height:43%;min-height:270px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.orb-zone:before,.orb-zone:after{content:"";position:absolute;border:1px solid #ff315522;border-radius:50%;animation:pulse 2.8s ease-in-out infinite}.orb-zone:before{width:210px;height:210px}.orb-zone:after{width:300px;height:300px;animation-delay:.7s}.orb{width:142px;height:142px;border-radius:50%;position:relative;z-index:2;background:radial-gradient(circle at 35% 30%,#fff 0 4%,#ffdce1 10%,#ff536c 31%,#d80e32 58%,#5e0717 100%);box-shadow:0 0 25px #ff244877,0 0 75px #ff244844,inset 0 0 25px #fff8;animation:float 3s ease-in-out infinite;display:flex;align-items:center;justify-content:center}.orb:before{content:"";width:76px;height:76px;border-radius:50%;border:2px solid #fff9;box-shadow:0 0 20px #fff8}.orb:after{content:"ARIA";position:absolute;font-weight:800;font-size:17px;letter-spacing:2px;color:#fff;text-shadow:0 1px 10px #0008}.orb.listening{animation:listen .65s ease-in-out infinite alternate}.orb.thinking{animation:think 1s linear infinite}.waves{position:absolute;z-index:1;width:330px;height:130px}.waves i{position:absolute;inset:0;border-radius:50%;border:1px solid #fff2;transform:scaleX(1.8);animation:wave 2.4s ease-in-out infinite}.waves i:nth-child(2){animation-delay:.35s}.waves i:nth-child(3){animation-delay:.7s}.waves i:nth-child(4){animation-delay:1.05s}
.hero{text-align:center;position:absolute;top:22px;left:0;right:0;pointer-events:none}.hero h1{font-size:22px;margin:0 0 4px}.hero p{font-size:11px;color:var(--muted);margin:0}.messages{flex:1;overflow:auto;padding:0 13px 172px;scroll-behavior:smooth}.welcome{text-align:center;margin:0 auto 10px;color:var(--muted);font-size:12px}.welcome strong{color:#fff;font-size:14px}.chips{display:flex;gap:7px;overflow:auto;padding:12px 0 4px;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid #fff1;background:#111114;color:#ddd;border-radius:999px;padding:9px 12px;font-size:10px}.bubble{max-width:90%;padding:11px 14px;border-radius:20px;line-height:1.9;white-space:pre-wrap;word-break:break-word;margin:7px 0;box-shadow:0 8px 28px #0008;font-size:13px}.aria{margin-left:auto;background:#111114;border:1px solid #29292e}.user{margin-right:auto;background:linear-gradient(145deg,#3a0e17,#19090d);border:1px solid #6b1c2a}.error{border-color:#ff315655;color:#ffb0bb}.source{display:block;margin-top:6px;color:#888;font-size:9px}.media{display:block;max-width:100%;max-height:46vh;border-radius:16px;margin-top:8px}
.composer{position:fixed;left:0;right:0;bottom:0;padding:8px max(10px,calc((100vw - 900px)/2 + 10px)) calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#050505 22%,#050505 72%);z-index:30}.tools{display:flex;gap:6px;overflow:auto;padding:2px 1px 7px;scrollbar-width:none}.tool{white-space:nowrap;border:1px solid #29292e;background:#101012;color:#ddd;border-radius:999px;padding:7px 10px;font-size:10px}.tool.active{border-color:#ff3155;background:#260b12;color:#fff;box-shadow:0 0 15px #ff315522}.bar{display:flex;gap:7px;align-items:flex-end;border:1px solid #34343a;border-radius:25px;padding:7px;background:#0b0b0def;backdrop-filter:blur(18px);box-shadow:0 10px 38px #000c}.bar textarea{flex:1;min-height:43px;max-height:110px;padding:9px;background:transparent;color:#fff;border:0;outline:0;resize:none;font:inherit;font-size:14px}.btn{width:45px;height:45px;border:0;border-radius:50%;font-size:18px;background:#fff;color:#080808}.mic{background:linear-gradient(145deg,#fff,#ddd);box-shadow:0 0 16px #fff2}.send{background:linear-gradient(145deg,#ff3155,#c30d2d);color:#fff}.send:disabled{opacity:.35}.hidden{display:none}
@keyframes pulse{50%{transform:scale(1.08);opacity:.35}}@keyframes float{50%{transform:translateY(-7px) scale(1.03)}}@keyframes listen{to{transform:scale(1.12);box-shadow:0 0 40px #ff2444aa,0 0 110px #ff244455,inset 0 0 28px #fff}}@keyframes think{to{transform:rotate(360deg)}}@keyframes wave{0%,100%{transform:scaleX(1.35) scaleY(.35);opacity:.08}50%{transform:scaleX(1.8) scaleY(1);opacity:.7}}
</style>
</head>
<body><main class="app">
<header class="top"><div class="brand"><img class="logo" src="/icon.svg"><div><b>ARIA</b><small>Personal AI • فارسی</small></div></div><div class="status"><span class="dot" id="dot"></span><span id="status">در حال اتصال</span></div></header>
<section class="stage"><div class="hero"><h1>سلام، من آریا هستم</h1><p>صحبت کن؛ فارسی می‌فهمم و پاسخ می‌دهم.</p></div>
<div class="orb-zone"><div class="waves"><i></i><i></i><i></i><i></i></div><div id="orb" class="orb"></div></div>
<section id="messages" class="messages"><div class="welcome" id="welcome"><strong>آماده‌ام.</strong><div class="chips"><button class="chip" data-q="سلام آریا، چه کارهایی می‌توانی برای من انجام بدهی؟">قابلیت‌ها</button><button class="chip" data-q="یک برنامه هوشمند برای امروز من بساز.">برنامه‌ریزی</button><button class="chip" data-q="برای ساخت یک تصویر حرفه‌ای راهنمایی‌ام کن.">تصویر</button><button class="chip" data-q="یک ایده خلاقانه برای من بساز.">ایده</button></div></div></section></section>
<div class="composer"><div class="tools"><button class="tool" id="install">＋ نصب</button><button class="tool" id="web">🌐 وب</button><button class="tool" id="imageBtn">✦ تصویر</button><button class="tool" id="editBtn">✎ ادیت</button><button class="tool" id="videoBtn">▶ ویدیو</button><button class="tool active" id="voice">◉ پاسخ صوتی</button><button class="tool" id="clear">حافظه</button></div><form id="form" class="bar"><textarea id="input" rows="1" placeholder="با آریا صحبت کن…" autocomplete="off"></textarea><button class="btn mic" id="mic" type="button">🎙</button><button class="btn send" id="send" type="submit">↑</button></form></div>
</main><input id="file" type="file" accept="image/*" class="hidden">
<script>
const $=id=>document.getElementById(id),messages=$('messages'),form=$('form'),input=$('input'),send=$('send'),statusEl=$('status'),dot=$('dot'),welcome=$('welcome'),mic=$('mic'),file=$('file'),orb=$('orb');let memory=localStorage.getItem('aria_memory')||'',deferredPrompt=null,web=false,voiceOutput=localStorage.getItem('aria_voice')!=='0',mediaMode='chat';
function add(text,who){welcome?.remove();const el=document.createElement('div');el.className='bubble '+who;el.textContent=text;messages.appendChild(el);messages.scrollTop=messages.scrollHeight;return el}function busy(v){send.disabled=v;orb.classList.toggle('thinking',v);send.textContent=v?'…':'↑'}function listening(v){orb.classList.toggle('listening',v);if(v)orb.classList.remove('thinking')}
async function health(){try{const r=await fetch('/api/health');const d=await r.json();statusEl.textContent=d.configured?'آنلاین • '+d.model:'آماده';dot.style.background=d.configured?'#63f2b0':'#ffb45c'}catch{statusEl.textContent='اتصال ناموفق';dot.style.background='#ff547a'}}
async function chat(text,image=null){add(text,'user');const b=add('در حال فکر کردن…','aria');busy(true);try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,memory,image,web})});const d=await r.json();if(!r.ok)throw Error(d.error||'خطا');b.textContent=d.text||'پاسخی دریافت نشد.';if(d.sources?.length){const s=document.createElement('small');s.className='source';s.textContent='منابع: '+d.sources.slice(0,4).map(x=>x.title||x.url||'منبع').join(' • ');b.appendChild(s)}memory=(memory+'\nکاربر: '+text+'\nARIA: '+(d.text||'')).slice(-30000);localStorage.setItem('aria_memory',memory);if(voiceOutput)voice(d.text||'')}catch(e){b.className='bubble aria error';b.textContent='خطا: '+e.message}finally{busy(false);input.focus()}}
async function voice(t){try{const r=await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t,voice:'alloy'})});const d=await r.json();if(r.ok&&d.audio){new Audio(d.audio).play().catch(()=>{});return}}catch{}if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fa-IR';u.rate=.98;speechSynthesis.speak(u)}}
form.addEventListener('submit',e=>{e.preventDefault();const t=input.value.trim();if(!t||send.disabled)return;input.value='';if(mediaMode==='image'){generateImage(t);mediaMode='chat';return}if(mediaMode==='edit'){file.click();input.dataset.editPrompt=t;return}if(mediaMode==='video'){requestVideo(t);mediaMode='chat';return}chat(t)});
$('clear').onclick=()=>{memory='';localStorage.removeItem('aria_memory');add('حافظهٔ محلی پاک شد.','aria')};$('web').onclick=()=>{web=!web;$('web').classList.toggle('active',web)};$('voice').onclick=()=>{voiceOutput=!voiceOutput;localStorage.setItem('aria_voice',voiceOutput?'1':'0');$('voice').classList.toggle('active',voiceOutput)};$('imageBtn').onclick=()=>{mediaMode='image';input.placeholder='توضیح تصویر را بگو…';input.focus()};$('editBtn').onclick=()=>{mediaMode='edit';input.placeholder='دستور ویرایش را بگو…';input.focus()};$('videoBtn').onclick=()=>{mediaMode='video';input.placeholder='توضیح ویدیو را بگو…';input.focus()};
async function generateImage(prompt){const b=add('در حال آماده‌سازی تصویر…','aria');busy(true);try{const r=await fetch('/api/image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,quality:'high'})});const d=await r.json();if(!r.ok)throw Error(d.error||'ساخت تصویر ناموفق');b.textContent='تصویر آماده شد.';if(d.image){const img=document.createElement('img');img.className='media';img.src=d.image;b.appendChild(img)}}catch(e){b.className='bubble aria error';b.textContent='خطا: '+e.message}finally{busy(false);input.placeholder='با آریا صحبت کن…'}}
file.onchange=()=>{const f=file.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>editImage(input.dataset.editPrompt||'این تصویر را حرفه‌ای ویرایش کن.',rd.result);rd.readAsDataURL(f);file.value=''};async function editImage(prompt,image){const b=add('در حال ویرایش تصویر…','aria');busy(true);try{const r=await fetch('/api/image-edit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,image})});const d=await r.json();if(!r.ok)throw Error(d.error||'ویرایش ناموفق');b.textContent='ویرایش انجام شد.';if(d.image){const img=document.createElement('img');img.className='media';img.src=d.image;b.appendChild(img)}}catch(e){b.className='bubble aria error';b.textContent='خطا: '+e.message}finally{busy(false);input.placeholder='با آریا صحبت کن…'}}
async function requestVideo(prompt){const b=add('درخواست ویدیو ارسال شد…','aria');busy(true);try{const r=await fetch('/api/media',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,mode:'video'})});const d=await r.json();if(!r.ok)throw Error(d.error||'سرویس ویدیو متصل نیست');b.textContent=d.url||d.video_url||d.message||'ویدیو در حال پردازش است.'}catch(e){b.className='bubble aria error';b.textContent='خطا: '+e.message}finally{busy(false);input.placeholder='با آریا صحبت کن…'}}
let recognition=null;if('SpeechRecognition'in window||'webkitSpeechRecognition'in window){const R=window.SpeechRecognition||window.webkitSpeechRecognition;recognition=new R();recognition.lang='fa-IR';recognition.interimResults=false;recognition.continuous=false;recognition.onstart=()=>listening(true);recognition.onend=()=>listening(false);recognition.onerror=()=>listening(false);recognition.onresult=e=>{input.value=e.results[0][0].transcript;form.requestSubmit()}}else mic.disabled=true;mic.onclick=()=>{try{recognition?.start()}catch{}};
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e});$('install').onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();deferredPrompt=null}else add('از منوی مرورگر گزینه «نصب برنامه» را انتخاب کن.','aria')};document.querySelectorAll('[data-q]').forEach(x=>x.onclick=()=>{input.value=x.dataset.q;form.requestSubmit()});if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});$('voice').classList.toggle('active',voiceOutput);health();input.focus();
</script></body></html>
