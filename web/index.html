<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#070914"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"><title>ARIA • AI</title><style>:root{--bg:#060711;--panel:#0d1020;--line:#292f49;--text:#f7f8ff;--muted:#8f97ad;--a:#7c5cff;--b:#20d9ff;--ok:#63f2b0}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:radial-gradient(900px 500px at 50% -10%,#1b1740 0,#060711 58%);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow:hidden}.app{height:100dvh;max-width:980px;margin:auto;display:flex;flex-direction:column}.top{height:70px;padding:10px 15px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff10;background:#070914d9;backdrop-filter:blur(20px);z-index:5}.brand{display:flex;align-items:center;gap:10px}.logo{width:46px;height:46px;border-radius:15px;box-shadow:0 0 28px #6e5cff66}.brand b{font-size:22px}.brand small{display:block;color:var(--muted);font-size:10px}.status{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px}.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 12px currentColor}.hero{padding:20px 15px 8px}.hero h1{font-size:29px;margin:0 0 5px}.hero p{margin:0;color:var(--muted);font-size:13px}.capgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:13px 15px 3px}.cap{padding:10px 5px;text-align:center;border:1px solid #ffffff0d;border-radius:15px;background:linear-gradient(145deg,#11152a,#0a0d19);color:#cfd5e6;font-size:10px}.cap i{display:block;font-style:normal;font-size:18px;margin-bottom:4px}.messages{flex:1;overflow:auto;padding:12px 14px 188px}.welcome{margin:20px 0 16px;padding:18px;border:1px solid #ffffff0c;border-radius:24px;background:linear-gradient(145deg,#11162b99,#090b16cc);box-shadow:0 18px 50px #0006}.welcome strong{font-size:14px}.welcome div{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.chip{border:1px solid #ffffff12;background:#ffffff07;color:#cdd3e4;padding:10px;border-radius:13px;text-align:center;font-size:11px}.bubble{max-width:91%;padding:12px 15px;border-radius:19px;line-height:1.9;white-space:pre-wrap;word-break:break-word;margin:8px 0;box-shadow:0 8px 25px #0003}.aria{margin-left:auto;background:linear-gradient(145deg,#11162a,#0c1020);border:1px solid #252b44}.user{margin-right:auto;background:linear-gradient(145deg,#22132c,#151126);border:1px solid #48316b}.error{border-color:#ff416b55;color:#ff9fb5}.source{display:block;margin-top:8px;color:#8e98b2;font-size:10px}.media{display:block;max-width:100%;max-height:52vh;border-radius:15px;margin-top:9px}.composer{position:fixed;left:0;right:0;bottom:0;padding:7px max(10px,calc((100vw - 980px)/2 + 10px)) calc(9px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#060711 18%,#060711 70%);z-index:10}.tools{display:flex;gap:7px;overflow:auto;padding:2px 1px 8px;scrollbar-width:none}.tools::-webkit-scrollbar{display:none}.tool{white-space:nowrap;border:1px solid #292f49;background:#0f1322;color:#dfe4f1;border-radius:999px;padding:8px 11px;font-size:11px}.tool.active{border-color:#765cff;background:#1b1636;color:#fff;box-shadow:0 0 15px #765cff25}.bar{display:flex;gap:7px;align-items:flex-end;border:1px solid #303650;border-radius:22px;padding:7px;background:#0d1020ef;backdrop-filter:blur(18px);box-shadow:0 10px 35px #0008}.bar textarea{flex:1;min-height:42px;max-height:110px;padding:8px;background:transparent;color:#fff;border:0;outline:0;resize:none;font:inherit;font-size:14px}.btn{width:45px;height:45px;border:0;border-radius:16px;font-size:18px;background:#fff;color:#080a12}.mic{background:linear-gradient(135deg,var(--a),var(--b));color:#fff}.send{background:linear-gradient(135deg,#fff,#dfe4ff)}.send:disabled{opacity:.35}.hidden{display:none}</style></head><body><main class="app"><header class="top"><div class="brand"><img class="logo" src="/icon.svg"><div><b>ARIA</b><small>Personal Intelligence • v6</small></div></div><div class="status"><span class="dot" id="dot"></span><span id="status">در حال اتصال</span></div></header><section class="hero"><h1>سلام، من آریا هستم.</h1><p>یک دستیار هوشمند فارسی برای فکر کردن، ساختن و انجام دادن.</p></section><section class="capgrid"><div class="cap"><i>◈</i>هوش و تحقیق</div><div class="cap"><i>⌁</i>وب و جستجو</div><div class="cap"><i>✦</i>تصویر و ادیت</div><div class="cap"><i>◉</i>صدا و حافظه</div></section><section id="messages" class="messages"><div class="welcome" id="welcome"><strong>از اینجا شروع کن</strong><div><button class="chip" data-q="امروز چه کارهایی می‌توانی برای من انجام بدهی؟">قابلیت‌ها</button><button class="chip" data-q="در وب برای من جستجو کن و نتیجه را خلاصه کن.">تحقیق وب</button><button class="chip" data-q="برای من یک ایده خلاقانه برای تصویر بساز.">ساخت تصویر</button><button class="chip" data-q="یک برنامه روزانه هوشمند برایم بساز.">برنامه‌ریزی</button></div></div></section><div class="composer"><div class="tools"><button class="tool" id="install">＋ نصب</button><button class="tool active" id="web">🌐 وب</button><button class="tool" id="imageBtn">✦ تصویر</button><button class="tool" id="editBtn">✎ ادیت</button><button class="tool" id="videoBtn">▶ ویدیو</button><button class="tool" id="voice">◉ صدا</button><button class="tool" id="clear">حافظه</button></div><form id="form" class="bar"><textarea id="input" rows="1" placeholder="با ARIA صحبت کن…" autocomplete="off"></textarea><button class="btn mic" id="mic" type="button">⌁</button><button class="btn send" id="send" type="submit">↑</button></form></div></main><input id="file" type="file" accept="image/*" class="hidden"><script>const $=id=>document.getElementById(id),messages=$('messages'),form=$('form'),input=$('input'),send=$('send'),statusEl=$('status'),dot=$('dot'),welcome=$('welcome'),mic=$('mic'),file=$('file'),logo=document.querySelector('.logo');let memory=localStorage.getItem('aria_memory')||'',deferredPrompt=null,web=true,voiceOutput=localStorage.getItem('aria_voice')!=='0',mediaMode='chat';function add(text,who){welcome?.remove();const el=document.createElement('div');el.className='bubble '+who;el.textContent=text;messages.appendChild(el);messages.scrollTop=messages.scrollHeight;return el}function busy(v){send.disabled=v;send.textContent=v?'…':'↑';logo.style.filter=v?'brightness(1.4)':'none'}async function health(){try{const r=await fetch('/api/health');const d=await r.json();statusEl.textContent=d.configured?'آنلاین • '+d.model:'در انتظار اتصال AI';dot.style.background=d.configured?'#63f2b0':'#ffb45c'}catch{statusEl.textContent='اتصال ناموفق';dot.style.background='#ff547a'}}async function chat(text,image=null){add(text,'user');const b=add('در حال فکر کردن…','aria');busy(true);try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,memory,image,web})});const d=await r.json();if(!r.ok)throw Error(d.error||'خطا');b.textContent=d.text||'پاسخی دریافت نشد.';if(d.sources?.length){const s=document.createElement('small');s.className='source';s.textContent='منابع: '+d.sources.slice(0,4).map(x=>x.title||x.url||'منبع').join(' • ');b.appendChild(s)}memory=(memory+'\nکاربر: '+text+'\nARIA: '+(d.text||'')).slice(-30000);localStorage.setItem('aria_memory',memory);if(voiceOutput)voice(d.text||'')}catch(e){b.className='bubble aria error';b.textContent='خطا: '+e.message}finally{busy(false);input.focus()}}async function voice(t){try{const r=await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t,voice:'alloy'})});const d=await r.json();if(r.ok&&d.audio){new Audio(d.audio).play().catch(()=>{});return}}catch{}if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fa-IR';speechSynthesis.speak(u)}}form.addEventListener('submit',e=>{e.preventDefault();const t=input.value.trim();if(!t||send.disabled)return;input.value='';if(mediaMode==='image'){generateImage(t);mediaMode='chat';return}if(mediaMode==='edit'){file.click();input.dataset.editPrompt=t;return}if(mediaMode==='video'){requestVideo(t);mediaMode='chat';return}chat(t)});$('clear').onclick=()=>{memory='';localStorage.removeItem('aria_memory');add('حافظهٔ محلی پاک شد.','aria')};$('web').onclick=()=>{web=!web;$('web').classList.toggle('active',web)};$('voice').onclick=()=>{voiceOutput=!voiceOutput;localStorage.setItem('aria_voice',voiceOutput?'1':'0');$('voice').classList.toggle('active',voiceOutput)};$('imageBtn').onclick=()=>{mediaMode='image';input.placeholder='توضیح تصویر را بنویس…';input.focus()};$('editBtn').onclick=()=>{mediaMode='edit';input.placeholder='دستور ویرایش تصویر…';input.focus()};$('videoBtn').onclick=()=>{mediaMode='video';input.placeholder='توضیح ویدیو را بنویس…';input.focus()};async function generateImage(prompt){const b=add('در حال ساخت تصویر حرفه‌ای…','aria');busy(true);try{const r=await fetch('/api/image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,quality:'high'})});const d=await r.json();if(!r.ok)throw Error(d.error||'ساخت تصویر ناموفق');b.textContent='تصویر آماده شد.';if(d.image){const img=document.createElement('img');img.className='media';img.src=d.image;b.appendChild(img)}}catch(e){b.className='bubble aria error';b.textContent='خطا: '+e.message}finally{busy(false);input.placeholder='با ARIA صحبت کن…'}}file.onchange=()=>{const f=file.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>editImage(input.dataset.editPrompt||'این تصویر را حرفه‌ای ویرایش کن.',rd.result);rd.readAsDataURL(f);file.value=''};async function editImage(prompt,image){const b=add('در حال ویرایش تصویر…','aria');busy(true);try{const r=await fetch('/api/image-edit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,image})});const d=await r.json();if(!r.ok)throw Error(d.error||'ویرایش ناموفق');b.textContent='ویرایش انجام شد.';if(d.image){const img=document.createElement('img');img.className='media';img.src=d.image;b.appendChild(img)}}catch(e){b.className='bubble aria error';b.textContent='خطا: '+e.message}finally{busy(false);input.placeholder='با ARIA صحبت کن…'}}async function requestVideo(prompt){const b=add('درخواست ویدیو ارسال شد…','aria');busy(true);try{const r=await fetch('/api/media',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,mode:'video'})});const d=await r.json();if(!r.ok)throw Error(d.error||'سرویس ویدیو هنوز متصل نیست');b.textContent=d.url||d.video_url||d.message||'ویدیو در حال پردازش است.'}catch(e){b.className='bubble aria error';b.textContent='خطا: '+e.message}finally{busy(false);input.placeholder='با ARIA صحبت کن…'}}let recognition=null;if('SpeechRecognition'in window||'webkitSpeechRecognition'in window){const R=window.SpeechRecognition||window.webkitSpeechRecognition;recognition=new R();recognition.lang='fa-IR';recognition.interimResults=false;recognition.onresult=e=>{input.value=e.results[0][0].transcript;form.requestSubmit()}}else mic.disabled=true;mic.onclick=()=>recognition?.start();window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e});$('install').onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();deferredPrompt=null}else add('از منوی مرورگر گزینه «نصب برنامه» را انتخاب کن.','aria')};document.querySelectorAll('[data-q]').forEach(x=>x.onclick=()=>{input.value=x.dataset.q;form.requestSubmit()});if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});$('voice').classList.toggle('active',voiceOutput);health();input.focus();</script></body></html>
