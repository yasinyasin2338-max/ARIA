<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#090b12"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest"><title>ARIA</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080a0f;color:#f5f7fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif;height:100dvh;overflow:hidden}.app{height:100%;display:flex;flex-direction:column;max-width:900px;margin:auto}.top{padding:14px 16px 10px;border-bottom:1px solid #202533;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:900}.orb{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ff7b7b 28%,#d5162d 58%,#4a0610);box-shadow:0 0 0 4px #ffffff10,0 0 24px #e51d3b55}.status{font-size:12px;color:#72e6a4;display:flex;gap:6px;align-items:center}.dot{width:7px;height:7px;border-radius:50%;background:#72e6a4}.messages{flex:1;overflow:auto;padding:20px 14px 145px;display:flex;flex-direction:column;gap:12px}.bubble{max-width:88%;padding:12px 15px;border-radius:18px;line-height:1.8;white-space:pre-wrap;word-break:break-word}.aria{align-self:flex-start;background:#151a25;border:1px solid #242b3a}.user{align-self:flex-end;background:#2a1820;border:1px solid #51202b}.composer{position:fixed;bottom:0;left:0;right:0;padding:8px max(10px,calc((100vw - 900px)/2 + 10px));background:linear-gradient(transparent,#080a0f 22%)}.tools{display:flex;gap:7px;overflow:auto;padding:4px 2px 8px}.tool{white-space:nowrap;border:1px solid #293142;background:#111620;color:#e9edf5;border-radius:999px;padding:8px 11px}.bar{display:flex;gap:7px;background:#111620;border:1px solid #293142;border-radius:20px;padding:7px}.bar textarea{flex:1;background:transparent;border:0;outline:0;color:#fff;resize:none;font:inherit;min-height:42px;max-height:120px;padding:8px}.btn{border:0;border-radius:15px;background:#fff;color:#090b12;font-weight:800;min-width:48px}.mic{background:#d5162d;color:#fff}.send:disabled{opacity:.4}.welcome{text-align:center;color:#9aa4b5;margin:auto}.welcome h1{font-size:34px;margin:0 0 8px}.welcome p{margin:0;color:#7f8999}.error{color:#ff9c9c}.install{display:none}
</style></head>
<body><main class="app"><header class="top"><div class="brand"><span class="orb"></span><span>ARIA</span></div><div class="status"><span class="dot"></span><span id="status">در حال اتصال...</span></div></header><section id="messages" class="messages"><div class="welcome" id="welcome"><h1>سلام، من ARIA هستم</h1><p>دستیار هوش مصنوعی فارسی شما</p></div></section><div class="composer"><div class="tools"><button class="tool" id="install">نصب روی گوشی</button><button class="tool" id="voice">🎙️ حالت صوتی</button><button class="tool" id="imageBtn">🖼️ تصویر</button><button class="tool" id="videoBtn">🎬 ویدیو</button><button class="tool" id="clear">پاک‌کردن حافظه</button></div><form id="form" class="bar"><textarea id="input" rows="1" placeholder="با ARIA صحبت کن..." autocomplete="off"></textarea><button class="btn mic" id="mic" type="button">🎙️</button><button class="btn send" id="send" type="submit">➤</button></form></div></main>
<input id="file" type="file" accept="image/*" hidden>
<script>
const $=id=>document.getElementById(id),messages=$('messages'),form=$('form'),input=$('input'),send=$('send'),statusEl=$('status'),welcome=$('welcome'),mic=$('mic'),install=$('install'),file=$('file');
let memory=localStorage.getItem('aria_memory')||'',deferredPrompt=null;
function add(text,who){welcome?.remove();const el=document.createElement('div');el.className='bubble '+who;el.textContent=text;messages.appendChild(el);messages.scrollTop=messages.scrollHeight;return el}
async function health(){try{const r=await fetch('/api/health');const d=await r.json();statusEl.textContent=d.configured?'آنلاین • '+d.model:'کلید تنظیم نشده';statusEl.previousElementSibling.style.background=d.configured?'#72e6a4':'#ffb45c'}catch{statusEl.textContent='اتصال ناموفق';statusEl.previousElementSibling.style.background='#ff6b6b'}}
async function chat(text){add(text,'user');const bubble=add('در حال فکر کردن...','aria');send.disabled=true;try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,memory})});const d=await r.json();if(!r.ok)throw new Error(d.error||'خطا');bubble.textContent=d.text||'پاسخی دریافت نشد.';memory=(memory+'\nکاربر: '+text+'\nARIA: '+bubble.textContent).slice(-24000);localStorage.setItem('aria_memory',memory);speak(d.text||'')}catch(err){bubble.className='bubble aria error';bubble.textContent='خطا: '+err.message}finally{send.disabled=false;input.focus()}}
form.addEventListener('submit',e=>{e.preventDefault();const t=input.value.trim();if(t&&!send.disabled){input.value='';chat(t)}});
$('clear').onclick=()=>{memory='';localStorage.removeItem('aria_memory');add('حافظهٔ محلی پاک شد.','aria')};$('imageBtn').onclick=()=>file.click();$('videoBtn').onclick=()=>{input.value='از این تصویر/توضیح یک ویدیوی حرفه‌ای بساز: ';input.focus()};
file.onchange=()=>{if(file.files[0]){add('تصویر انتخاب شد: '+file.files[0].name,'user');input.value='این تصویر را تحلیل و پیشنهادهای ویرایش بده.';input.focus()}};
function speak(t){if('speechSynthesis'in window&&t){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fa-IR';u.rate=1;speechSynthesis.speak(u)}}
let recognition=null;if('SpeechRecognition'in window||'webkitSpeechRecognition'in window){const R=window.SpeechRecognition||window.webkitSpeechRecognition;recognition=new R();recognition.lang='fa-IR';recognition.interimResults=false;recognition.onresult=e=>{input.value=e.results[0][0].transcript;form.requestSubmit()};recognition.onerror=()=>{}}else mic.disabled=true;
mic.onclick=()=>recognition?.start();$('voice').onclick=()=>{if(recognition)recognition.start();else alert('تشخیص گفتار فارسی در این مرورگر در دسترس نیست.')};
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;install.style.display='inline-block'});install.onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();deferredPrompt=null}};
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});health();input.focus();
</script></body></html>
