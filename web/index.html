<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#070910"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest"><title>ARIA • AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070910;color:#f6f7fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif;height:100dvh;overflow:hidden}.app{height:100%;display:flex;flex-direction:column;max-width:980px;margin:auto}.top{padding:12px 15px 9px;border-bottom:1px solid #202533;display:flex;align-items:center;justify-content:space-between;background:#080a10cc;backdrop-filter:blur(16px);z-index:3}.brand{display:flex;align-items:center;gap:10px;font-size:23px;font-weight:900}.orb{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#fff,#ff7d91 22%,#dc183b 54%,#470511);box-shadow:0 0 0 3px #ffffff0d,0 0 26px #e51d3b66;animation:pulse 2.6s infinite}.orb.busy{animation:spin 1s linear infinite}@keyframes pulse{50%{box-shadow:0 0 0 7px #e51d3b10,0 0 34px #e51d3b99}}@keyframes spin{to{transform:rotate(360deg)}}.status{font-size:11px;color:#72e6a4;display:flex;gap:6px;align-items:center}.dot{width:7px;height:7px;border-radius:50%;background:#72e6a4}.messages{flex:1;overflow:auto;padding:18px 13px 165px;display:flex;flex-direction:column;gap:12px}.bubble{max-width:90%;padding:12px 15px;border-radius:18px;line-height:1.85;white-space:pre-wrap;word-break:break-word}.aria{align-self:flex-start;background:#131824;border:1px solid #252d3d}.user{align-self:flex-end;background:#2a1820;border:1px solid #542431}.welcome{text-align:center;color:#9aa4b5;margin:auto}.welcome h1{font-size:35px;margin:0 0 8px}.welcome p{margin:0;color:#7f8999}.error{color:#ff9c9c}.source{display:block;margin-top:8px;color:#aab4c7;font-size:11px}.composer{position:fixed;bottom:0;left:0;right:0;padding:7px max(9px,calc((100vw - 980px)/2 + 9px));background:linear-gradient(transparent,#070910 22%);z-index:4}.tools{display:flex;gap:7px;overflow:auto;padding:4px 2px 8px}.tool{white-space:nowrap;border:1px solid #293142;background:#111620;color:#e9edf5;border-radius:999px;padding:8px 11px}.tool.active{border-color:#d5162d}.bar{display:flex;gap:7px;background:#111620;border:1px solid #293142;border-radius:20px;padding:7px}.bar textarea{flex:1;background:transparent;border:0;outline:0;color:#fff;resize:none;font:inherit;min-height:42px;max-height:120px;padding:8px}.btn{border:0;border-radius:15px;background:#fff;color:#090b12;font-weight:800;min-width:48px}.mic{background:#d5162d;color:#fff}.send:disabled{opacity:.4}.media{max-width:90%;border-radius:16px;margin-top:8px}.hidden{display:none}
</style></head>
<body><main class="app"><header class="top"><div class="brand"><span class="orb" id="orb"></span><span>ARIA</span></div><div class="status"><span class="dot" id="dot"></span><span id="status">در حال اتصال...</span></div></header><section id="messages" class="messages"><div class="welcome" id="welcome"><h1>سلام، من ARIA هستم</h1><p>دستیار هوشمند فارسی شما</p></div></section><div class="composer"><div class="tools"><button class="tool" id="install">📲 نصب</button><button class="tool" id="web">🌐 وب</button><button class="tool" id="imageBtn">🖼️ ساخت تصویر</button><button class="tool" id="editBtn">✨ ویرایش تصویر</button><button class="tool" id="videoBtn">🎬 ویدیو</button><button class="tool" id="voice">🔊 صدا</button><button class="tool" id="clear">🧠 پاک‌کردن حافظه</button></div><form id="form" class="bar"><textarea id="input" rows="1" placeholder="با ARIA صحبت کن..." autocomplete="off"></textarea><button class="btn mic" id="mic" type="button">🎙️</button><button class="btn send" id="send" type="submit">➤</button></form></div></main>
<input id="file" type="file" accept="image/*" class="hidden">
<script>
const $=id=>document.getElementById(id),messages=$('messages'),form=$('form'),input=$('input'),send=$('send'),statusEl=$('status'),dot=$('dot'),welcome=$('welcome'),mic=$('mic'),file=$('file'),orb=$('orb');
let memory=localStorage.getItem('aria_memory')||'', deferredPrompt=null, web=true, voiceOutput=localStorage.getItem('aria_voice')!=='0', mediaMode='chat';
function add(text,who){welcome?.remove();const el=document.createElement('div');el.className='bubble '+who;el.textContent=text;messages.appendChild(el);messages.scrollTop=messages.scrollHeight;return el}
function busy(v){orb.classList.toggle('busy',v);send.disabled=v}
async function health(){try{const r=await fetch('/api/health');const d=await r.json();statusEl.textContent=d.configured?'آنلاین • '+d.model:'کلید AI تنظیم نشده';dot.style.background=d.configured?'#72e6a4':'#ffb45c'}catch{statusEl.textContent='اتصال ناموفق';dot.style.background='#ff6b6b'}}
function speakBrowser(t){if(!voiceOutput||!('speechSynthesis'in window)||!t)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fa-IR';u.rate=1;speechSynthesis.speak(u)}
async function speakServer(t){try{const r=await fetch('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t,voice:'alloy'})});if(!r.ok){speakBrowser(t);return}const d=await r.json();if(d.audio){new Audio(d.audio).play().catch(()=>speakBrowser(t))}}catch{speechSynthesis?.speak?.(new SpeechSynthesisUtterance(t))}}
async function chat(text,image=null){add(text,'user');const bubble=add('در حال فکر کردن...','aria');busy(true);try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,memory,image,web})});const d=await r.json();if(!r.ok)throw new Error(d.error||'خطا');bubble.textContent=d.text||'پاسخی دریافت نشد.';if(d.sources?.length){const s=document.createElement('div');s.className='source';s.textContent='منابع وب: '+d.sources.slice(0,4).map(x=>x.title||x.url||'منبع').join(' • ');bubble.appendChild(s)}memory=(memory+'\nکاربر: '+text+'\nARIA: '+(d.text||'')).slice(-30000);localStorage.setItem('aria_memory',memory);if(voiceOutput)openAIvoice(d.text||'');}catch(err){bubble.className='bubble aria error';bubble.textContent='خطا: '+err.message}finally{busy(false);input.focus()}}
async function openAIvoice(t){await speakServer(t)}
form.addEventListener('submit',e=>{e.preventDefault();const t=input.value.trim();if(!t||send.disabled)return;input.value='';if(mediaMode==='image'){generateImage(t);mediaMode='chat';return}if(mediaMode==='edit'){file.click();input.dataset.editPrompt=t;return}if(mediaMode==='video'){requestVideo(t);mediaMode='chat';return}chat(t)});
$('clear').onclick=()=>{memory='';localStorage.removeItem('aria_memory');add('حافظهٔ محلی ARIA پاک شد.','aria')};$('web').onclick=()=>{web=!web;$('web').classList.toggle('active',web);add(web?'جست‌وجوی وب فعال شد.':'جست‌وجوی وب غیرفعال شد.','aria')};$('voice').onclick=()=>{voiceOutput=!voiceOutput;localStorage.setItem('aria_voice',voiceOutput?'1':'0');$('voice').classList.toggle('active',voiceOutput)};
$('imageBtn').onclick=()=>{mediaMode='image';input.placeholder='توضیح تصویر را بنویس...';input.focus()};$('editBtn').onclick=()=>{mediaMode='edit';input.placeholder='دستور ویرایش را بنویس...';input.focus()};$('videoBtn').onclick=()=>{mediaMode='video';input.placeholder='توضیح ویدیو را بنویس...';input.focus()};
async function generateImage(prompt){const b=add('در حال ساخت تصویر...','aria');busy(true);try{const r=await fetch('/api/image',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,quality:'high'})});const d=await r.json();if(!r.ok)throw new Error(d.error||'ساخت تصویر ناموفق بود');b.textContent='تصویر ساخته شد.';if(d.image){const img=document.createElement('img');img.className='media';img.src=d.image;b.appendChild(img)}}catch(e){b.className='bubble aria error';b.textContent='خطا: '+e.message}finally{busy(false);input.placeholder='با ARIA صحبت کن...'}}
file.onchange=async()=>{const f=file.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{const prompt=input.dataset.editPrompt||'این تصویر را حرفه‌ای ویرایش کن.';input.dataset.editPrompt='';editImage(prompt,reader.result)};reader.readAsDataURL(f);file.value=''};
async function editImage(prompt,image){const b=add('در حال ویرایش تصویر...','aria');busy(true);try{const r=await fetch('/api/image-edit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,image})});const d=await r.json();if(!r.ok)throw new Error(d.error||'ویرایش ناموفق بود');b.textContent='ویرایش انجام شد.';if(d.image){const img=document.createElement('img');img.className='media';img.src=d.image;b.appendChild(img)}}catch(e){b.className='bubble aria error';b.textContent='خطا: '+e.message}finally{busy(false);input.placeholder='با ARIA صحبت کن...'}}
async function requestVideo(prompt){const b=add('درخواست ویدیو ارسال شد...','aria');busy(true);try{const r=await fetch('/api/media',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt,mode:'video'})});const d=await r.json();if(!r.ok)throw new Error(d.error||'سرویس ویدیو متصل نیست');b.textContent=d.url||d.video_url||d.message||'ویدیو در حال پردازش است.'}catch(e){b.className='bubble aria error';b.textContent='خطا: '+e.message}finally{busy(false);input.placeholder='با ARIA صحبت کن...'}}
let recognition=null;if('SpeechRecognition'in window||'webkitSpeechRecognition'in window){const R=window.SpeechRecognition||window.webkitSpeechRecognition;recognition=new R();recognition.lang='fa-IR';recognition.interimResults=false;recognition.onresult=e=>{input.value=e.results[0][0].transcript;form.requestSubmit()};recognition.onerror=()=>{}}else mic.disabled=true;mic.onclick=()=>recognition?.start();
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e});$('install').onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();deferredPrompt=null}else alert('از منوی مرورگر گزینهٔ نصب برنامه را بزن.')};
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});$('web').classList.toggle('active',web);$('voice').classList.toggle('active',voiceOutput);health();input.focus();
</script></body></html>
