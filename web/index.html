<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b12"><title>ARIA</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090b12;color:#f5f7fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif;height:100dvh;overflow:hidden}.app{height:100%;display:flex;flex-direction:column;max-width:900px;margin:auto}.top{padding:18px 18px 12px;border-bottom:1px solid #202533;display:flex;align-items:center;justify-content:space-between}.brand{font-size:25px;font-weight:800;letter-spacing:.5px}.status{font-size:12px;color:#72e6a4;display:flex;gap:6px;align-items:center}.dot{width:7px;height:7px;border-radius:50%;background:#72e6a4}.messages{flex:1;overflow:auto;padding:22px 16px 110px;display:flex;flex-direction:column;gap:12px}.bubble{max-width:86%;padding:12px 15px;border-radius:18px;line-height:1.8;white-space:pre-wrap;word-break:break-word}.aria{align-self:flex-start;background:#151a25;border:1px solid #242b3a}.user{align-self:flex-end;background:#24314d}.composer{position:fixed;bottom:0;left:0;right:0;padding:12px max(12px,calc((100vw - 900px)/2 + 12px));background:linear-gradient(transparent,#090b12 25%)}.bar{display:flex;gap:8px;background:#111620;border:1px solid #293142;border-radius:18px;padding:8px}.bar textarea{flex:1;background:transparent;border:0;outline:0;color:#fff;resize:none;font:inherit;min-height:42px;max-height:130px;padding:8px}.send{border:0;border-radius:14px;background:#fff;color:#090b12;font-weight:800;padding:0 18px}.send:disabled{opacity:.4}.welcome{text-align:center;color:#9aa4b5;margin:auto}.welcome h1{font-size:36px;margin:0 0 8px}.welcome p{margin:0;color:#7f8999}.error{color:#ff9c9c}
</style></head>
<body><main class="app"><header class="top"><div class="brand">ARIA</div><div class="status"><span class="dot"></span><span id="status">در حال اتصال...</span></div></header><section id="messages" class="messages"><div class="welcome" id="welcome"><h1>سلام، من ARIA هستم</h1><p>دستیار هوش مصنوعی فارسی شما</p></div></section><div class="composer"><form id="form" class="bar"><textarea id="input" rows="1" placeholder="پیامت را بنویس..." autocomplete="off"></textarea><button class="send" id="send" type="submit">ارسال</button></form></div></main>
<script>
const messages=document.getElementById('messages'),form=document.getElementById('form'),input=document.getElementById('input'),send=document.getElementById('send'),statusEl=document.getElementById('status'),welcome=document.getElementById('welcome');
let memory=localStorage.getItem('aria_memory')||'';
function add(text,who){welcome?.remove();const el=document.createElement('div');el.className='bubble '+who;el.textContent=text;messages.appendChild(el);messages.scrollTop=messages.scrollHeight;return el}
async function health(){try{const r=await fetch('/api/health');const d=await r.json();statusEl.textContent=d.configured?'آنلاین':'کلید تنظیم نشده';statusEl.previousElementSibling.style.background=d.configured?'#72e6a4':'#ffb45c'}catch{statusEl.textContent='اتصال ناموفق';statusEl.previousElementSibling.style.background='#ff6b6b'}}
form.addEventListener('submit',async e=>{e.preventDefault();const text=input.value.trim();if(!text||send.disabled)return;add(text,'user');input.value='';send.disabled=true;const bubble=add('در حال پاسخ...','aria');try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,memory})});const d=await r.json();if(!r.ok)throw new Error(d.error||'خطا');bubble.textContent=d.text||'پاسخی دریافت نشد.';memory=(memory+'\nکاربر: '+text+'\nARIA: '+bubble.textContent).slice(-20000);localStorage.setItem('aria_memory',memory)}catch(err){bubble.className='bubble aria error';bubble.textContent='خطا: '+err.message}finally{send.disabled=false;input.focus()}});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}});health();input.focus();
</script></body></html>
