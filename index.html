<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070912"><meta name="description" content="ARIA — دستیار شخصی هوشمند"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/styles.css"><title>ARIA — Ultimate AI</title></head><body><div class="app"><header class="top"><div class="brand"><div class="orb">A</div><div><div class="title">ARIA <span>ULTIMATE</span></div><div class="sub" id="status">آماده‌ام</div></div></div><div class="actions"><button class="iconbtn" id="voiceOut">🔇</button><button class="iconbtn" id="imageBtn">🎨</button><button class="iconbtn" id="settings">⚙️</button></div></header><main id="chat"></main><div class="composer"><div class="bar"><button class="mic" id="mic">🎙️</button><textarea id="input" rows="1" placeholder="با آریا صحبت کن…"></textarea><button class="stop" id="stop">■</button><button class="send" id="send">➤</button></div></div></div>
<div class="panel" id="panel"><div class="sheet"><div class="row"><strong>تنظیمات</strong><button id="close">بستن</button></div><div class="row"><span>جستجوی وب</span><input id="web" type="checkbox" checked></div><div class="row"><span>پاسخ صوتی</span><input id="speak" type="checkbox"></div><div class="row"><span>کیفیت بالای تصویر</span><input id="highImage" type="checkbox" checked></div><label for="memory">حافظه شخصی</label><textarea id="memory" class="memory" placeholder="ترجیحات و اطلاعاتی که می‌خواهی آریا به خاطر بسپارد…"></textarea><label for="token">توکن خصوصی سرور</label><input id="token" class="textinput" type="password" placeholder="اختیاری"><div class="row"><span>پشتیبان</span><button id="export">خروجی JSON</button></div><div class="row"><span>پاک‌سازی</span><button id="clear">پاک کردن</button></div></div></div>
<div class="panel" id="imagePanel"><div class="sheet studio"><div class="row"><strong>استودیو تصویر</strong><button id="closeImage">بستن</button></div><div class="tabs"><button class="tab active" data-tab="gen">متن → تصویر</button><button class="tab" data-tab="edit">تصویر → تصویر</button></div><section id="gen"><textarea id="imagePrompt" class="memory" placeholder="تصویر را با جزئیات توصیف کن…"></textarea><div class="row"><select id="imageSize"><option value="auto">خودکار</option><option value="1536x1024">افقی</option><option value="1024x1024">مربع</option><option value="1024x1536">عمودی</option></select><button id="generateImage">ساخت تصویر</button></div></section><section id="edit" hidden><label class="upload"><input id="editFile" type="file" accept="image/png,image/jpeg,image/webp"><span>📷 انتخاب تصویر</span></label><img id="editPreview" class="preview" hidden><textarea id="editPrompt" class="memory" placeholder="چه تغییری روی تصویر می‌خواهی؟"></textarea><button id="editImage" class="fullbtn">ویرایش تصویر</button></section><div id="imageResult"></div></div></div><script src="/app.js"></script></body></html>
