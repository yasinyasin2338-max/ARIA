<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090b12"><meta name="description" content="ARIA — دستیار شخصی هوشمند"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/styles.css"><title>ARIA — Ultra Personal AI</title></head><body><div class="app"><header class="top"><div class="brand"><div class="orb">A</div><div><div class="title">ARIA ULTRA</div><div class="sub" id="status">آماده‌ام</div></div></div><div class="actions"><button class="iconbtn" id="voiceOut" title="پاسخ صوتی">🔇</button><button class="iconbtn" id="imageBtn" title="ساخت تصویر">🎨</button><button class="iconbtn" id="settings" title="تنظیمات">⚙️</button></div></header><main id="chat"></main><div class="composer"><div class="bar"><button class="mic" id="mic" title="ورودی صوتی">🎙️</button><textarea id="input" rows="1" placeholder="با آریا صحبت کن…" autocomplete="off"></textarea><button class="stop" id="stop" title="توقف">■</button><button class="send" id="send" title="ارسال">➤</button></div></div></div><div class="panel" id="panel"><div class="sheet"><div class="row"><strong>تنظیمات ARIA ULTRA</strong><button id="close">بستن</button></div><div class="row"><span>جستجوی وب</span><input id="web" type="checkbox" checked></div><div class="row"><span>پاسخ صوتی</span><input id="speak" type="checkbox"></div><div class="row"><span>حالت تصویر با کیفیت بالا</span><input id="highImage" type="checkbox" checked></div><label class="memory-label" for="memory">حافظه شخصی</label><textarea id="memory" class="memory" placeholder="مثلاً: من فارسی صحبت می‌کنم و پاسخ‌های کوتاه را ترجیح می‌دهم."></textarea><label class="memory-label" for="token">توکن دسترسی خصوصی (اگر روی سرور تنظیم شده)</label><input id="token" class="textinput" type="password" placeholder="Bearer token"><div class="row"><span>پشتیبان گفتگو و حافظه</span><button id="export">خروجی JSON</button></div><div class="row"><span>پاک کردن گفتگو و حافظه</span><button id="clear">پاک کردن</button></div><div class="status">کلیدهای سرویس فقط روی سرور نگهداری می‌شوند.</div></div></div><div class="panel" id="imagePanel"><div class="sheet"><div class="row"><strong>استودیو تصویر ARIA</strong><button id="closeImage">بستن</button></div><textarea id="imagePrompt" class="memory" placeholder="توضیح دقیق تصویر را بنویس…"></textarea><div class="row"><select id="imageSize"><option value="1536x1024">افقی 1536×1024</option><option value="1024x1024">مربع 1024×1024</option><option value="1024x1536">عمودی 1024×1536</option></select><button id="generateImage">ساخت تصویر</button></div><div id="imageResult"></div></div></div><script src="/app.js"></script></body></html>
