name: ARIA ULTIMATE APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: wget -q https://services.gradle.org/distributions/gradle-8.13-bin.zip && unzip -q gradle-8.13-bin.zip
      - run: ./gradle-8.13/bin/gradle -p ARIA_ANDROID assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ARIA-ULTIMATE-debug-apk
          path: ARIA_ANDROID/app/build/outputs/apk/debug/app-debug.apk
