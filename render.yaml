services:
  - type: web
    name: aria-ai
    runtime: node
    rootDir: ARIA_SERVER
    buildCommand: npm install
    startCommand: npm start
    plan: free
    region: frankfurt
    autoDeploy: true
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: ARIA_MODEL
        value: gpt-5
      - key: ARIA_IMAGE_MODEL
        value: gpt-image-1
      - key: ARIA_WEB_SEARCH
        value: "true"
