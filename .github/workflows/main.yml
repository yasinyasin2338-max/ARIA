name: Build ARIA ULTIMATE 2.0 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Extract ARIA ULTIMATE
        run: |
          mkdir -p aria_extract
          unzip -oq ARIA_ULTIMATE_2.0_FINAL.zip -d aria_extract

      - name: Locate Android project
        run: |
          PROJECT_DIR=$(find aria_extract -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -print -quit | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found"
            find aria_extract -maxdepth 5 -type f | head -200
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Install Gradle 8.13
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q gradle-8.13-bin.zip

      - name: Build ARIA APK
        run: |
          ./gradle-8.13/bin/gradle -p "$PROJECT_DIR" assembleDebug --no-daemon

      - name: Find APK
        run: |
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload ARIA APK
        uses: actions/upload-artifact@v4
        with:
          name: ARIA-ULTIMATE-2.0-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
