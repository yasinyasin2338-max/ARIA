name: Build ARIA APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Extract project
        run: unzip -q ARIA_ANDROID_FINAL_FIXED.zip

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q gradle-8.13-bin.zip

      - name: Build APK
        run: |
          ./gradle-8.13/bin/gradle -p ARIA_ANDROID assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARIA-debug-apk
          path: ARIA_ANDROID/app/build/outputs/apk/debug/app-debug.apk
