name: Build ARIA ULTIMATE 2.0 APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Extract ARIA ULTIMATE 2.0
        run: |
          unzip -q ARIA_ULTIMATE_2.0_FINAL.zip
          find . -maxdepth 4 -type f -name settings.gradle.kts -print

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q gradle-8.13-bin.zip

      - name: Build APK
        run: |
          PROJECT_DIR=$(find . -type f -name settings.gradle.kts -print -quit | xargs dirname)
          echo "Project: $PROJECT_DIR"
          ./gradle-8.13/bin/gradle -p "$PROJECT_DIR" assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARIA-ULTIMATE-2.0-debug
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
