name: Universal Hub Smoke Test

on:
  push:
    branches: [hub-v071-full-stage]
  workflow_dispatch:

jobs:
  staging-oauth:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Build staged Hub image
        run: docker build -t hub-oauth-test ./tts-pocket

      - name: Run staged Hub OAuth, model, connector-manager, mobile UI and privilege-drop smoke tests
        shell: bash
        run: |
          set -euo pipefail
          TEST_PASS="$(python -c 'import secrets; print(secrets.token_urlsafe(32))')"
          export CI_TEST_PASSWORD="$TEST_PASS"
          export CI_HUB_BASE="http://127.0.0.1:18000"

          docker run -d --name hubtest --user 0 -p 18000:8000 \
            -e PORT=8000 \
            -e UTH_ENV=development \
            -e UTH_AUTH_ENABLED=true \
            -e UTH_BOOTSTRAP_ADMIN_EMAIL=admin@test.local \
            -e UTH_BOOTSTRAP_ADMIN_PASSWORD="$TEST_PASS" \
            -e UTH_PUBLIC_BASE_URL=http://127.0.0.1:18000 \
            -e UTH_HTTP_ALLOWED_HOSTS=127.0.0.1,localhost \
            -e UTH_ALLOWED_ORIGINS=http://127.0.0.1:18000 \
            -e UTH_MCP_ALLOWED_HOSTS=127.0.0.1,localhost \
            -e UTH_MCP_ALLOWED_ORIGINS=http://127.0.0.1:18000 \
            -e UTH_OPENROUTER_API_KEY=ci-placeholder-key \
            -e UTH_OPENROUTER_MODEL=ci/test-model \
            hub-oauth-test

          cleanup(){ docker logs hubtest || true; docker rm -f hubtest || true; }
          trap cleanup EXIT

          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18000/health >/tmp/health.json; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18000/health >/tmp/health.json

          runtime_uid="$(docker exec hubtest sh -c "awk '/^Uid:/{print \$2}' /proc/1/status")"
          test "$runtime_uid" != "0"

          python ./tts-pocket/ci_oauth_smoke.py
          python ./tts-pocket/ci_connector_smoke.py

          test "$(curl -sS -o /tmp/oauth-app-manager.html -w '%{http_code}' http://127.0.0.1:18000/static/oauth-app-manager.html)" = "200"
          grep -q 'تنظیم OAuth سرویس‌ها' /tmp/oauth-app-manager.html

          test "$(curl -sS -o /tmp/hub-index.html -w '%{http_code}' http://127.0.0.1:18000/)" = "200"
          grep -q 'data-hub-admin-links' /tmp/hub-index.html
          grep -q 'مدیریت Token' /tmp/hub-index.html
          grep -q 'تنظیم OAuth سرویس‌ها' /tmp/hub-index.html
          grep -q 'Secure Compact Runtime' /tmp/hub-index.html

          docker cp ./tts-pocket/ci_model_smoke.py hubtest:/tmp/ci_model_smoke.py
          docker exec hubtest python /tmp/ci_model_smoke.py

  production-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check live production health, auth, OAuth, model and connector-manager boundary
        shell: bash
        run: |
          set -euo pipefail
          base="https://aria-v4-production.up.railway.app"
          resource="$base/mcp"

          test "$(curl -sS -o /tmp/health.json -w '%{http_code}' "$base/health")" = "200"
          grep -q '"status":"ok"' /tmp/health.json
          grep -q '"auth_enabled":true' /tmp/health.json
          grep -q '"mcp_available":true' /tmp/health.json
          grep -q '"openrouter"' /tmp/health.json
          test "$(curl -sS -o /tmp/ready.json -w '%{http_code}' "$base/ready")" = "200"
          test "$(curl -sS -o /tmp/tools.json -w '%{http_code}' "$base/api/tools")" = "401"
          test "$(curl -sS -o /tmp/models.json -w '%{http_code}' "$base/api/models")" = "401"
          test "$(curl -sS -o /tmp/oauth-apps.json -w '%{http_code}' "$base/api/oauth-apps")" = "401"
          test "$(curl -sS -o /tmp/oauth-app-config.json -w '%{http_code}' "$base/api/oauth/github/app-config")" = "401"
          test "$(curl -sS -o /tmp/token-helper.html -w '%{http_code}' "$base/static/token-helper.html")" = "200"
          test "$(curl -sS -o /tmp/oauth-app-manager.html -w '%{http_code}' "$base/static/oauth-app-manager.html")" = "200"
          grep -q 'تنظیم OAuth سرویس‌ها' /tmp/oauth-app-manager.html

          test "$(curl -sS -o /tmp/oauth-meta.json -w '%{http_code}' "$base/.well-known/oauth-authorization-server")" = "200"
          grep -q '"authorization_endpoint"' /tmp/oauth-meta.json
          grep -q '"token_endpoint"' /tmp/oauth-meta.json
          grep -q '"S256"' /tmp/oauth-meta.json
          grep -q '"refresh_token"' /tmp/oauth-meta.json

          test "$(curl -sS -o /tmp/resource-meta.json -w '%{http_code}' "$base/.well-known/oauth-protected-resource")" = "200"
          grep -Fq "\"resource\":\"$resource\"" /tmp/resource-meta.json

          token_code=$(curl -sS -o /tmp/invalid-token.json -w '%{http_code}' \
            -X POST "$base/oauth/token" \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data 'grant_type=authorization_code&code=not-a-real-code&client_id=not-a-real-client&redirect_uri=https%3A%2F%2Fexample.com%2Fcb&code_verifier=invalid&resource=https%3A%2F%2Faria-v4-production.up.railway.app%2Fmcp')
          test "$token_code" = "400"
          grep -q '"error"' /tmp/invalid-token.json

          echo "PRODUCTION_CONNECTOR_MANAGER_BOUNDARY_OK"
